# Isolated test stack — runs alongside `make dev` without colliding.
#
# Use with `docker compose -p bis-test -f docker-compose.yaml \
# -f docker-compose.test.yaml ...`. The project name `bis-test` keeps
# container/network names distinct from the dev stack.
#
# Services bind to no host ports except a single test-only nginx port (8090)
# and the Playwright UI-mode port (8100). The DB runs on its own named volume
# so dev data is not touched.

services:
  nginx:
    container_name: bis-test-nginx
    ports: !override
      - 8090:80
    volumes: !override
      - ./nginx/test.conf:/etc/nginx/templates/default.conf.template
      - ./logs:/app/logs
      - ./backend/media:/app/media

  # Postgres + backend are gated behind profiles so `test_frontend` (which is
  # fully mocked via page.route) can run nginx + frontend only — no DB, no
  # Django. They come up for `test_cookbook` (real e2e), `test_backend`, and
  # the dev profile.
  postgres:
    container_name: bis-test-postgres
    ports: !override []
    volumes: !override
      - postgresqldata_test:/var/lib/postgresql/data
    environment:
      POSTGRES_DATABASE: bis_test
      POSTGRES_DB: bis_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    profiles:
      - backend
      - cookbook
      - dev

  backend:
    image: bis-backend:latest
    container_name: bis-test-backend
    ports: !override []
    restart: "no"
    command: ["sh", "docker-entrypoint.sh", "testing"]
    environment:
      DB_NAME: bis_test
      DB_USERNAME: postgres
      DB_PASSWORD: 123
      GROQ_API_KEY: ""
      ENVIRONMENT: testing
      ALLOWED_HOSTS: "*"
    profiles:
      - backend
      - cookbook
      - dev

  frontend:
    image: bis-frontend:latest
    container_name: bis-test-frontend
    restart: "no"
    ports: !override []
    command: ["sh", "docker-entrypoint.sh", "dev"]
    environment:
      HOST: 0.0.0.0
      NODE_ENV: development
      VITE_ENVIRONMENT: testing
      VITE_E2E: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    profiles:
      - frontend
      - dev

  cookbook:
    image: bis-cookbook:latest
    container_name: bis-test-cookbook
    restart: "no"
    ports: !override []
    command: ["sh", "docker-entrypoint.sh", "dev"]
    environment:
      HOST: 0.0.0.0
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    profiles:
      - cookbook
      - dev

  # Host-less Playwright runner using the upstream image, which ships the
  # browsers at /ms-playwright. `@playwright/test` itself comes from the app's
  # node_modules via the bind mount, so its version must stay in sync with the
  # image tag. Brought up only via `docker compose run --rm playwright` — its
  # profile is not enabled by `up`, so it never auto-starts.
  #
  # `--ui` serves the Playwright UI over HTTP on 8100 (published with
  # `run --service-ports`), so interactive runs need no X server. The WSLg /
  # X11 mounts remain for `--headed` and `--debug`, and are a no-op on a
  # headless host.
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: bis-test-playwright
    restart: "no"
    working_dir: /e2e
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["npx", "playwright"]
    ports:
      - 8100:8100
    volumes:
      - ./cookbook:/e2e
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    environment:
      HOME: /tmp
      PW_BASE_URL: http://nginx
      # Playwright reads CI for retries + forbidOnly; compose does not forward
      # host env by default.
      CI: ${CI:-}
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp}
      PULSE_SERVER: ${PULSE_SERVER:-}
    # No depends_on — the Makefile's `up --wait -d --profile cookbook`
    # brings the rest of the stack up healthy before this container runs.
    # Adding depends_on here would couple build/run resolution to services
    # in the `cookbook` profile, which compose can't resolve without that
    # profile being active.
    profiles:
      - playwright

  # Same runner, but for the frontend (mock-only stack).
  playwright-frontend:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: bis-test-playwright-frontend
    restart: "no"
    working_dir: /e2e
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["npx", "playwright"]
    ports:
      - 8101:8100
    volumes:
      - ./frontend:/e2e
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    environment:
      HOME: /tmp
      PW_BASE_URL: http://nginx
      # Playwright reads CI for retries + forbidOnly; compose does not forward
      # host env by default.
      CI: ${CI:-}
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/tmp}
      PULSE_SERVER: ${PULSE_SERVER:-}
    profiles:
      - playwright-frontend

volumes:
  postgresqldata_test:
