# Temporary. Delete before merging.
#
# Frontend e2e suite time varies 1.2m-2.0m run to run, which is wider than any
# tuning effect we are trying to measure, so comparing two CI runs proves
# nothing. This runs both worker counts back to back on ONE runner, twice each
# and interleaved, so the comparison is against the same machine under the same
# conditions and ordering effects cancel.
name: perf experiment (worker count)

on:
  push:
    branches: [ perf/ci-speedup ]

jobs:
  workers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Start the Playwright image pull
        run: |
          image=$(grep -om1 'mcr\.microsoft\.com/playwright:[^ ]*' docker-compose.test.yaml)
          docker pull -q "$image" >/tmp/pw-pull.log 2>&1 &
          echo $! > /tmp/pw-pull.pid

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: bis-frontend:latest
          cache-from: type=gha,scope=frontend
      - uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/yarn.lock') }}

      - name: Wait for the Playwright image
        run: while kill -0 "$(cat /tmp/pw-pull.pid)" 2>/dev/null; do sleep 1; done

      - name: Run the suite at 2 and 4 workers, interleaved
        run: |
          set -o pipefail
          echo "nproc=$(nproc)"
          for w in 2 4 2 4; do
            start=$SECONDS
            make e2e_frontend workers=$w 2>&1 | tee /tmp/run.log
            echo "RESULT workers=$w wall=$((SECONDS-start))s $(grep -oE 'passed \([0-9.]+m?s?\)' /tmp/run.log | tail -1)"
          done
